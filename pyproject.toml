[tool.poetry]
name = "habit-tracker"
version = "0.1.0"
description = "Django Habit Tracker Application"
authors = ["Elena Kandrushina <your-email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2.3"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.1"
pillow = "^12.0.0"
black = "^25.11.0"
django-extensions = "^4.1"
djangorestframework = "^3.16.1"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.13.1"
drf-yasg = "^1.21.11"
stripe = "^14.1.0"
eventlet = "^0.40.4"
redis = "^7.1.0"
celery = "^5.6.2"
django-celery-beat = "^2.8.1"
django-cors-headers = "^4.9.0"

[tool.poetry.group.dev.dependencies]
ipython = "^9.7.0"
flake8 = "^7.3.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
